[workspace]
members = ["crates/llmbase-core", "crates/llmbase-model", "crates/llmbase-cli", "crates/llmbase-python", "examples/rust-extension"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "=1.2.2"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml = "0.9"
fs2 = "0.4"
walkdir = "2"
tempfile = "3"
unicode-normalization = "0.1"
ferrous-opencc = "0.3.1"
