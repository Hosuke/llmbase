# LLMBase Configuration
# LLM provider is configured via .env file:
#   LLMBASE_API_KEY, LLMBASE_BASE_URL, LLMBASE_MODEL
# See .env.example for setup instructions.

llm:
  max_tokens: 16384

paths:
  raw: "./raw"
  wiki: "./wiki"
  outputs: "./wiki/outputs"
  meta: "./wiki/_meta"
  concepts: "./wiki/concepts"

compile:
  batch_size: 10
  backlinks: true

# Web server
# web:
#   static_dir: "./my-frontend/dist"  # Custom frontend path (default: static/dist)

search:
  port: 5555

# Source API
# sources:
#   max_content_chars: 50000          # Content cap for /api/sources/<slug> (max 500K)

lint:
  web_search: false

worker:
  enabled: false
  learn_interval_hours: 6
  compile_interval_hours: 1
  taxonomy_interval_hours: 12
  health_check_interval_hours: 24
  learn_batch_size: 10
  learn_source: cbeta

health:
  auto_fix_broken_links: true
  max_stubs_per_run: 10

entities:
  enabled: false
  extract_interval_hours: 24

languages:
  default: trilingual
  profiles:
    trilingual:
      default_lang: zh-en
      api_default_lang: zh
      sections:
        - {code: en, key: english, header: "## English", label: English, icon: EN, title_hint: latin}
        - {code: zh, key: 中文, header: "## 中文", label: 中文, icon: 中, title_hint: cjk}
        - {code: ja, key: 日本語, header: "## 日本語", label: 日本語, icon: 日, title_hint: cjk}
      views:
        - {code: zh-en, show: [en, zh], label: 中英双语, icon: 双, title_hint: full, primary: zh}

# Monolingual Classical-Chinese example (single section, EMPTY header → bare body):
# languages:
#   default: wenyan
#   profiles:
#     wenyan:
#       sections:
#         - {code: wenyan, key: 文言, header: "", label: 文言, icon: 文}
