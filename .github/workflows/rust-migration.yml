name: Rust migration contracts
on:
  pull_request:
  push:
    branches: [main, master, rust-core-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Native lint, tests and standalone release
        run: bash scripts/rust-migration/check-native.sh
      - name: Build and actually install the candidate wheel
        run: bash scripts/rust-migration/check-candidate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/llmbase-candidate"
      - name: Existing frontend typecheck and build
        run: bash scripts/rust-migration/check-frontend.sh
